name: Atualizar Sofascore
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/sofascore.py
      - run: |
          git config user.name "gframe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sofascore.json
          git diff --cached --quiet || git commit -m "Sofascore: atualização automática"
          git push
