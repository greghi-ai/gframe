<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfólio · GFRAME</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>body{margin:0}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: soft light page with rounded photo panels. Hero rotates athletes; work shown as real posts; a route map Brasil → Itália; dark and âmbar panels close. Motion: hero crossfade + slow zoom, marquee, drawn route, scroll reveals. */
:root{
  --page:#F3F2EF; --card:#FFFFFF; --ink:#0B0B0C; --mute:#A3A09A; --soft:#6B6862; --line:#E2E0DB; --amb:#C8954A; --amb-2:#E0A65A; --dark:#111110;
  --sans:"Inter Tight",system-ui,sans-serif; --r:28px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
[hidden]{display:none!important}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:1280px;margin-inline:auto}
:focus-visible{outline:2px solid var(--amb);outline-offset:3px}
.raio{display:inline-block;fill:currentColor}
.go{display:inline-flex;align-items:center;gap:12px;background:var(--ink);color:#fff;text-decoration:none;font-weight:600;font-size:13px;padding:6px 6px 6px 18px;border-radius:999px;transition:transform .25s}
.go b{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--amb);color:var(--ink);font-weight:600;transition:transform .3s}
.go:hover b{transform:rotate(45deg)}
.go.light{background:#fff;color:var(--ink)}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:14px 16px;position:relative;z-index:10}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.02em;text-decoration:none}
.brand .raio{width:17px;height:auto;color:var(--amb)}
.tb-right{display:flex;align-items:center;gap:10px;position:relative}
.menu-btn{display:inline-flex;align-items:center;gap:10px;background:transparent;border:1px solid var(--line);color:var(--ink);font:600 13px var(--sans);padding:10px 14px;border-radius:999px;cursor:pointer}
.menu-btn i{display:grid;gap:4px}.menu-btn i::before,.menu-btn i::after{content:"";display:block;width:16px;height:1.5px;background:currentColor;transition:transform .25s}
.menu-btn[aria-expanded="true"] i::before{transform:translateY(2.75px) rotate(45deg)}.menu-btn[aria-expanded="true"] i::after{transform:translateY(-2.75px) rotate(-45deg)}
.menu-pop{position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border-radius:18px;padding:8px;min-width:250px;box-shadow:0 20px 50px rgba(0,0,0,.12);display:grid;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}}
.menu-pop a{display:flex;justify-content:space-between;text-decoration:none;font-weight:600;font-size:15px;padding:12px 14px;border-radius:12px}
.menu-pop a:hover{background:var(--page)}
@media(max-width:560px){.tb-right .go{display:none}}

/* HERO slider */
.hx{position:relative;aspect-ratio:16/9;max-height:calc(100vh - 100px);width:100%;border-radius:var(--r);overflow:hidden;background:#1a1a19;color:#fff}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.slide.on{opacity:1}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.02);transition:transform 7s linear}
.slide.on img{transform:scale(1.1)}
.shade{position:absolute;inset:0;background:linear-gradient(20deg,rgba(8,8,9,.85) 0%,rgba(8,8,9,.45) 32%,rgba(8,8,9,0) 58%);pointer-events:none}
.hx-copy{position:absolute;left:clamp(20px,3.4vw,44px);bottom:clamp(54px,6vw,80px);max-width:min(620px,62%);display:grid;gap:14px}
.hx-copy .who{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--amb-2)}
.hx-copy h1{margin:0;font-weight:600;letter-spacing:-.045em;line-height:.95;font-size:clamp(38px,5.4vw,78px);text-wrap:balance;min-height:1.9em}
.hx-copy h1 .acc{color:var(--amb-2)}
.hx-copy .w{display:inline-block;animation:wordin .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes wordin{from{opacity:0;transform:translateY(.4em);filter:blur(6px)}}
.bars{position:absolute;left:clamp(20px,3.4vw,44px);right:clamp(20px,3.4vw,44px);bottom:clamp(20px,2.6vw,32px);display:grid;grid-auto-flow:column;gap:8px}
.bars button{all:unset;cursor:pointer;display:grid;gap:8px;font-size:12px;font-weight:500;color:rgba(255,255,255,.7)}
.bars button i{display:block;height:2px;background:rgba(255,255,255,.28);border-radius:2px;overflow:hidden}
.bars button i::after{content:"";display:block;height:100%;width:0;background:#fff}
.bars button.on{color:#fff}
.bars button.on i::after{animation:fill var(--dur,6s) linear forwards}
.bars button.done i::after{width:100%}
@keyframes fill{to{width:100%}}
@media(max-width:760px){.hx{aspect-ratio:4/5;max-height:none}.hx-copy{max-width:none;right:20px}.shade{background:linear-gradient(0deg,rgba(8,8,9,.88) 0%,rgba(8,8,9,.45) 40%,rgba(8,8,9,0) 62%)}.bars span{display:none}}

/* marquee */
.marq{overflow:hidden;padding-block:clamp(22px,3vw,34px);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marq .rail{display:flex;gap:44px;width:max-content;animation:slide 38s linear infinite}
.marq span{font-weight:600;font-size:clamp(20px,2.4vw,30px);letter-spacing:-.03em;white-space:nowrap;display:flex;align-items:center;gap:44px}
.marq span::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--amb)}
@keyframes slide{to{transform:translateX(-50%)}}

/* sections */
.sec{padding-block:clamp(56px,7vw,96px) 0}
.mk{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--soft);margin-bottom:clamp(20px,3vw,32px)}
.mk i{display:grid;place-items:center;width:28px;height:28px;border:1px solid currentColor;border-radius:50%;font-style:normal;font-size:12px}
.mk hr{flex:1;border:0;border-top:1px solid var(--line);margin:0}
.two{margin:0;font-weight:600;letter-spacing:-.04em;line-height:1;font-size:clamp(32px,4.6vw,60px);text-wrap:balance;max-width:20ch}
.two span{color:var(--mute)}
.hrow{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
.hrow p{margin:0;max-width:36ch;color:var(--soft);font-size:14px}

/* posts */
.posts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:clamp(28px,4vw,48px)}
.post{background:var(--card);border-radius:22px;padding:10px;display:grid;gap:10px;transition:transform .4s cubic-bezier(.2,.7,.2,1),box-shadow .4s}
.post:hover{transform:translateY(-6px);box-shadow:0 24px 50px rgba(0,0,0,.08)}
.post .bar{display:flex;align-items:center;gap:8px;padding:4px 6px 0;font-size:12px;font-weight:600}
.post .bar .av{width:24px;height:24px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.post .bar .av .raio{width:11px;color:var(--amb)}
.post .bar small{margin-left:auto;color:var(--mute);font-weight:500}
.post .media{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:#ddd;max-width:100%}
.post .media img,.post .media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.post .media .f{opacity:0;transition:opacity .8s}.post .media .f.on{opacity:1}
.post .dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:5px}
.post .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5)}.post .dots i.on{background:#fff}
.post .cap{padding:2px 6px 8px}
.post .cap b{display:block;font-size:17px;letter-spacing:-.02em}
.post .cap span{font-size:12.5px;color:var(--soft)}
@media(max-width:860px){.posts{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.posts{grid-template-columns:1fr}}

/* map */
.map{position:relative;margin-top:clamp(28px,4vw,48px);border-radius:var(--r);background:var(--dark);color:#fff;overflow:hidden;padding:clamp(22px,3.4vw,44px);min-height:520px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.map::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.13) 1px,transparent 1.4px);background-size:16px 16px;mask-image:radial-gradient(ellipse at 50% 55%,#000 30%,transparent 78%)}
.map svg.route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.route path{fill:none;stroke:var(--amb-2);stroke-width:2;stroke-dasharray:6 8}
.route .draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 3.2s cubic-bezier(.6,.1,.2,1) .3s forwards;stroke-width:2.2}
@keyframes draw{to{stroke-dashoffset:0}}
.route circle{fill:var(--amb-2)}
.route .ping{fill:none;stroke:var(--amb-2);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
@keyframes ping{from{transform:scale(.4);opacity:1}to{transform:scale(2.6);opacity:0}}
.place{position:relative;z-index:1;display:grid;align-content:start;gap:14px}
.place.br{align-self:end}
.place.it{text-align:right;justify-items:end}
.place h3{margin:0;font-weight:600;font-size:clamp(28px,3.4vw,44px);letter-spacing:-.04em;line-height:1}
.place h3 small{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--amb-2);font-weight:600;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-width:420px}
.place.it .chips{justify-content:flex-end}
.chips span{font-size:13px;font-weight:500;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.chips span.hl{background:var(--amb);color:var(--ink);border-color:var(--amb)}
@media(max-width:760px){.map{grid-template-columns:1fr;min-height:0}.place.it{text-align:left;justify-items:start}.place.it .chips{justify-content:flex-start}.place.br{order:2}.map svg.route{opacity:.35}}

/* agências */
.ag{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:clamp(24px,3vw,36px)}
.ag div{background:var(--card);border-radius:22px;min-height:180px;display:grid;place-items:center;padding:24px;font-weight:700;font-size:clamp(34px,4.6vw,60px);letter-spacing:-.05em;color:#B9B5AE;transition:color .3s}
.ag div:hover{color:var(--ink)}
.aglogo{max-width:70%;max-height:64px;width:auto;height:auto;filter:brightness(0);opacity:.35;transition:opacity .3s}.aglogo.tall{max-height:104px}
.ag div:hover .aglogo{opacity:.9}
.ag small{display:block;font-size:12px;letter-spacing:0;font-weight:500;color:var(--mute);text-align:center;margin-top:6px}
@media(max-width:560px){.ag{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.ag div{min-height:84px;padding:12px;border-radius:16px;font-size:17px}.aglogo{max-width:86%;max-height:26px}.aglogo.tall{max-height:36px}}

/* atletas */
.arrows{display:flex;gap:10px}
.arrows button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:16px;cursor:pointer;transition:background .2s,color .2s}
.arrows button.k{background:var(--ink);color:#fff;border-color:var(--ink)}
.arrows button:hover{background:var(--amb);color:var(--ink);border-color:var(--amb)}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(250px,30vw,380px);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:clamp(24px,3vw,36px);padding-bottom:8px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.ath{scroll-snap-align:start;text-decoration:none}
.ph{position:relative;border-radius:var(--r);overflow:hidden;background:#ddd;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ath .ph{aspect-ratio:4/5}
.ath .ph img{transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.ath:hover .ph img{transform:scale(1.05)}
.glass{background:rgba(255,255,255,.14);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(255,255,255,.22);border-radius:16px}
.ath .tag{position:absolute;left:14px;bottom:14px;right:14px;padding:12px 14px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ath .tag b{font-weight:600;font-size:16px;letter-spacing:-.02em}
.ath .tag small{display:block;font-size:12px;opacity:.85}
.ath .tag i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.9);color:var(--ink);flex:none}

/* método */
.panel{border-radius:var(--r);background:var(--dark);color:#fff;padding:clamp(24px,4vw,48px)}
.panel .mk{color:#8A8782}.panel .mk hr{border-color:#2A2928}
.panel .two span{color:#6B6862}
.eps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:clamp(24px,3vw,40px)}
.ep{background:#1B1A19;border-radius:20px;padding:20px;display:grid;gap:28px;align-content:space-between;min-height:150px;transition:background .25s,transform .3s}
.ep:hover{background:#242220;transform:translateY(-3px)}
.ep small{color:var(--amb-2);font-weight:600;font-size:12px}
.ep b{font-weight:600;font-size:22px;letter-spacing:-.025em;line-height:1.1}
.ep em{font-style:normal;font-size:12px;color:#8A8782}
@media(max-width:820px){.eps{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.eps{grid-template-columns:1fr}}

/* cta */
.cta{margin-top:clamp(56px,7vw,96px);border-radius:var(--r);background:var(--amb);padding:clamp(28px,5vw,64px);display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:end;position:relative;overflow:hidden}
.cta .raio.big{position:absolute;right:-40px;top:-60px;width:clamp(180px,22vw,300px);height:auto;color:rgba(11,11,12,.08);animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(14px) rotate(4deg)}}
.cta h2{margin:0;font-weight:600;letter-spacing:-.045em;line-height:.95;font-size:clamp(40px,6vw,88px);position:relative}
.cta p{margin:0 0 16px;font-size:14px;max-width:34ch;position:relative}
.cta .handle{font-weight:600;user-select:all}
.cta>div{position:relative}
@media(max-width:760px){.cta{grid-template-columns:1fr}}
footer{padding-block:28px 36px;font-size:12px;color:var(--soft)}
footer .col{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}


/* athlete logos + soon */
.ath .alogo{position:absolute;left:18px;top:18px;height:34px;width:auto;max-width:55%;object-fit:contain;filter:drop-shadow(0 2px 10px rgba(0,0,0,.45))}
.ath.soon .soonbg{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#2a2826,#111110);display:grid;place-items:center}
.ath.soon .soonbg span{font-size:12px;color:#8A8782;letter-spacing:.06em;text-transform:uppercase}
.ath.soon .ph{aspect-ratio:4/5}
/* videos */
.vids{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 42px)/4);gap:14px;margin-top:clamp(24px,3vw,40px);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}.vids::-webkit-scrollbar{display:none}.vid{scroll-snap-align:start}.vid[hidden]{display:none!important}
.vctl{min-width:0;width:100%;max-width:100%;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:nowrap;margin-top:8px}.vfil{min-width:0;overflow-x:auto;flex-wrap:nowrap!important;scrollbar-width:none}.vfil::-webkit-scrollbar{display:none}.vfil button{white-space:nowrap;flex:none}.vctl .arrows{flex:none}.vfil{display:flex;gap:8px;flex-wrap:wrap}.vfil button{font:500 13px var(--sans);padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:all .2s}.vfil button:hover{border-color:var(--amb)}.vfil button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.vid{margin:0;display:grid;gap:10px}
.vbox{position:relative;aspect-ratio:9/16;border-radius:20px;overflow:hidden;background:#111;max-width:100%}
.vbox video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.vid:hover video{transform:scale(1.03)}
.snd{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:var(--ink);font-size:14px;cursor:pointer}
.snd.on{background:var(--amb)}
.vid figcaption b{display:block;font-size:14px;letter-spacing:-.01em}
.vid figcaption span{font-size:12px;color:var(--soft)}
@media(max-width:1000px){.vids{grid-auto-columns:calc((100% - 14px)/2.4)}}
@media(max-width:560px){.vids{grid-auto-columns:62%}.vctl .arrows{display:none}.vfil{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;max-width:100%}.vfil button{white-space:nowrap}}
/* global map */
.gl{margin-top:clamp(24px,3vw,40px);border-radius:var(--r);background:var(--dark);color:#fff;padding:clamp(16px,2.4vw,28px);display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:clamp(16px,2.4vw,28px)}
.glmap{position:relative;border-radius:20px;overflow:hidden;background:#151413}
#world{display:block;width:100%;height:auto;aspect-ratio:1000/520}
#world .land path{fill:#2B2A28;stroke:#151413;stroke-width:.4;transition:fill .5s}
#world .land path.hot{fill:#6E5330}
#world .land path.sel{fill:var(--amb)}
#world .routes path{fill:none;stroke:var(--amb-2);stroke-width:1.2;stroke-dasharray:500;stroke-dashoffset:500;animation:draw 3s cubic-bezier(.6,.1,.2,1) .4s forwards}
#world .pins circle{fill:#F2EFEA;stroke:#151413;stroke-width:calc(1.5px * var(--k,1))}
#world .pins text{fill:#E9E5DE;font-family:var(--sans);font-weight:600;font-size:calc(22px * var(--k,1));letter-spacing:.02em;paint-order:stroke;stroke:#151413;stroke-width:calc(5px * var(--k,1))}
#world .pins circle{r:calc(6px * var(--k,1))}
#world .routes path{stroke-width:calc(1.6px * var(--k,1))}
#world .ping{fill:none!important;stroke:#F2EFEA!important;stroke-width:calc(1.2px * var(--k,1))!important;transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ping{from{transform:scale(.5);opacity:1}to{transform:scale(3.4);opacity:0}}
.reset{position:absolute;left:12px;top:12px;border:0;background:rgba(255,255,255,.9);color:var(--ink);font:600 12px var(--sans);padding:8px 12px;border-radius:999px;cursor:pointer}
.glside{display:grid;gap:16px;align-content:start}
.cg small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--amb-2);font-weight:600;margin-bottom:8px}
.gl .chips{display:flex;flex-wrap:wrap;gap:8px}
.gl .chips button{font:500 13px var(--sans);color:#fff;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.gl .chips button:hover{border-color:var(--amb-2)}
.gl .chips button.on{background:var(--amb);color:var(--ink);border-color:var(--amb)}
.gldrawer{grid-column:1/-1;border-top:1px solid #2A2928;padding-top:18px;animation:pop .4s ease}
.gdh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.gdh b{font-size:24px;letter-spacing:-.03em;font-weight:600}
.gdh span{font-size:13px;color:#8A8782}
.gitems{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(150px,18vw,200px);gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.gitem{margin:0;display:grid;gap:8px}
.gitem .m{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:#1B1A19}
.gitem .m img,.gitem .m video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gitem figcaption{font-size:12.5px;color:#C9C4BC}
.gempty{font-size:14px;color:#8A8782;padding:22px;border:1px dashed #2A2928;border-radius:14px;max-width:520px}

<script>
(()=>{const fs=[...document.querySelectorAll('#aFil button')],box=document.getElementById('vids');fs.forEach(b=>b.addEventListener('click',()=>{fs.forEach(x=>x.classList.toggle('on',x===b));const f=b.dataset.f;box.querySelectorAll('.vid').forEach(v=>{v.hidden=!(f==='all'||v.dataset.a===f);if(v.hidden)v.querySelector('video').pause()})}))})();
(()=>{const menu=document.getElementById('menuBtn'),p=document.getElementById('menuPop');if(menu){const set=o=>{menu.setAttribute('aria-expanded',o);p.hidden=!o};menu.addEventListener('click',e=>{e.stopPropagation();set(p.hidden)});document.addEventListener('click',e=>{if(!p.contains(e.target))set(false)})}})();
(()=>{document.querySelectorAll('.vid').forEach(f=>{const v=f.querySelector('video'),b=f.querySelector('.snd');const play=()=>v.play().catch(()=>{});
 f.addEventListener('mouseenter',play);f.addEventListener('mouseleave',()=>{if(v.muted)v.pause()});
 new IntersectionObserver(es=>es.forEach(e=>{if(matchMedia('(hover: none)').matches){e.isIntersecting?play():v.pause()}}),{threshold:.6}).observe(v);
 b.addEventListener('click',()=>{document.querySelectorAll('.vid video').forEach(o=>{if(o!==v){o.muted=true;o.closest('.vid').querySelector('.snd').classList.remove('on')}});v.muted=!v.muted;b.classList.toggle('on',!v.muted);play()})})})();
(()=>{if(typeof Lenis==='undefined')return;const l=new Lenis({duration:1.15,easing:t=>1-Math.pow(1-t,3.2)});function r(t){l.raf(t);requestAnimationFrame(r)}requestAnimationFrame(r)})();
</script>
